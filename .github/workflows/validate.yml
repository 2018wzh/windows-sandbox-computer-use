name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate release layout
        run: python scripts/validate_release.py

      - name: Compile adapter
        run: python -m py_compile plugins/windows-sandbox-computer-use/skills/windows-sandbox-computer-use/scripts/sandbox_cua.py

      - name: Run focused unit tests
        run: >-
          python -m unittest discover
          -s plugins/windows-sandbox-computer-use/skills/windows-sandbox-computer-use/tests
          -p 'test_*.py'
          -v

      - name: Verify npx skills discovery
        run: npx --yes skills@latest add . --list
